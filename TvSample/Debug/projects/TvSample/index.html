<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RN Remote Test</title>
  <script src="./vendor/msf-2.0.14.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #121212; color: #eee;
                 font-family: sans-serif; overflow: hidden; }
    h1 { color: #bb86fc; font-size: 40px; margin: 30px 40px 0; }
    #last { font-size: 72px; font-weight: bold; color: #03dac6; margin: 20px 40px; min-height: 90px; }
    #log { list-style: none; margin: 0 40px; padding: 0; font-size: 24px; color: #aaa; }
    #log li { padding: 4px 0; border-bottom: 1px solid #222; }
  </style>
</head>
<body>
  <h1>RN Remote Test (MSF)</h1>
  <div id="last">Kanal bekleniyor...</div>
  <ul id="log"></ul>

  <script>
    // ponytail: channel name hardcoded; must match remoteProtocol.js CHANNEL.
    var CHANNEL_NAME = 'com.samsung.multiscreen.rnremote';

    var lastEl = document.getElementById('last');
    var logEl = document.getElementById('log');

    function show(label) {
      lastEl.textContent = label;
      var li = document.createElement('li');
      li.textContent = label;
      logEl.insertBefore(li, logEl.firstChild);
      if (logEl.children.length > 20) logEl.removeChild(logEl.lastChild);
    }

    if (!window.msf) {
      show('window.msf yok - msf-2.0.14.min.js ekli mi?');
    } else {
      window.msf.local(function (err, service) {
        if (err) { show('MSF hata: ' + JSON.stringify(err)); return; }
        var channel = service.channel(CHANNEL_NAME);
        channel.on('say', function (message) {
          console.log('[tv-test] say:', message);
          var m = null;
          try { m = JSON.parse(message); } catch (e) {}
          if (m && m.type === 'key') show('TUS: ' + m.value);
          else if (m && m.type === 'text') show('METIN: ' + m.value);
          else show(String(message));
        });
        channel.on('connect', function () { show('Kanal baglandi'); });
        channel.connect({ name: 'TvSample' }, function () {
          console.log('[tv-test] channel connected');
        }, function (e) {
          console.log('[tv-test] connect err', e);
        });
      });
    }
  </script>
</body>
</html>
